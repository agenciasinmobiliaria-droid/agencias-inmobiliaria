<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de administración</title><style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f4ef;color:#101f45}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd9d1;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 8px 24px rgba(16,31,69,.08)}h1{font-family:Georgia,serif;font-size:42px;margin:8px 0}h2{margin-top:0}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd9d1;border-radius:14px;font:inherit;margin:6px 0 14px}button{border:0;border-radius:14px;padding:13px 18px;background:#101f45;color:#fff;font-weight:800;cursor:pointer}.danger{background:#8d1d2c}.muted{color:#667085}.hidden{display:none}.login{max-width:440px;margin:12vh auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.submission{border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:12px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px;font-weight:700}@media(max-width:700px){.row{grid-template-columns:1fr}h1{font-size:34px}}
</style></head><body><div class="wrap">
<div id="login" class="card login"><h2>Acceso administrativo</h2><p class="muted">Panel privado para administrar solicitudes y configuración.</p><input id="password" type="password" placeholder="Contraseña de administrador"><button onclick="login()">Entrar</button><p id="loginMsg" class="muted"></p></div>
<div id="app" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="badge">PANEL PRIVADO</div><h1>Administración</h1></div><button class="danger" onclick="logout()">Cerrar sesión</button></div>
<div class="card"><h2>Configuración</h2><div class="row"><label>Correo para notificaciones<input id="notificationEmail"></label><label>Teléfono<input id="phone"></label></div><div class="row"><label>Oficina<input id="office"></label><label>WhatsApp (solo número, con país)<input id="whatsapp" placeholder="17324918176"></label></div><label>Tarifa de cita (USD)<input id="appointmentFee" type="number" step="0.01" min="0"></label><button onclick="saveConfig()">Guardar configuración</button><p id="configMsg" class="muted"></p></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Solicitudes recibidas</h2><button onclick="loadSubmissions()">Actualizar</button></div><div id="submissions"><p class="muted">Cargando…</p></div></div></div></div>
<script>
async function login(){const p=document.getElementById('password').value;const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json();if(!r.ok){document.getElementById('loginMsg').textContent=d.error||'No se pudo entrar';return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadConfig();loadSubmissions()}
async function logout(){await fetch('/api/admin-logout',{method:'POST'});location.reload()}
async function loadConfig(){const r=await fetch('/api/config');if(!r.ok)return;const d=await r.json();for(const k of ['notificationEmail','phone','office','whatsapp','appointmentFee'])document.getElementById(k).value=d[k]||''}
async function saveConfig(){const body={};for(const k of ['notificationEmail','phone','office','whatsapp','appointmentFee'])body[k]=document.getElementById(k).value;const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();document.getElementById('configMsg').textContent=r.ok?'Configuración guardada.':(d.error||'Error')}
async function loadSubmissions(){const box=document.getElementById('submissions');const r=await fetch('/api/admin-submissions');const d=await r.json();if(!r.ok){box.innerHTML='<p class="muted">'+(d.error||'No disponible')+'</p>';return}if(!d.submissions.length){box.innerHTML='<p class="muted">Todavía no hay solicitudes.</p>';return}box.innerHTML=d.submissions.map(s=>`<div class="submission"><strong>${esc(s.nombre)} ${esc(s.apellido)}</strong><div class="muted">${esc(s.email)} · ${esc(s.telefono)} · ${esc(s.createdAt)}</div><p><b>Cita:</b> ${esc(s.fecha)} ${esc(s.hora)} · ${esc(s.visita)}</p><p><b>Empleo:</b> ${esc(s.empleado||'')} · <b>Ingreso:</b> ${esc(s.ingreso||'')}</p><p><b>Método de pago:</b> ${esc(s.metodo_pago||'')} · <b>Acepta $135:</b> ${esc(s.pago100||'')}</p><p>${esc(s.comentarios||'')}</p></div>`).join('')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
